name: Developer Build CD

on:
  workflow_dispatch:
    inputs:
      namespace_name:
        description: 'Namespace to deploy'
        required: true
        default: 'developer-build'
      backoffice_branch:
        description: 'Branch for backoffice'
        default: 'main'
      backoffice_bff_branch:
        description: 'Branch for backoffice-bff'
        default: 'main'
      cart_branch:
        description: 'Branch for cart'
        default: 'main'
      customer_branch:
        description: 'Branch for customer'
        default: 'main'
      inventory_branch:
        description: 'Branch for inventory'
        default: 'main'
      media_branch:
        description: 'Branch for media'
        default: 'main'
      order_branch:
        description: 'Branch for order'
        default: 'main'
      payment_branch:
        description: 'Branch for payment'
        default: 'main'
      product_branch:
        description: 'Branch for product'
        default: 'main'
      recommendation_branch:
        description: 'Branch for recommendation'
        default: 'main'
      sampledata_branch:
        description: 'Branch for sampledata'
        default: 'main'
      search_branch:
        description: 'Branch for search'
        default: 'main'
      storefront_branch:
        description: 'Branch for storefront'
        default: 'main'
      storefront_bff_branch:
        description: 'Branch for storefront-bff'
        default: 'main'
      swagger_ui_branch:
        description: 'Branch for swagger-ui'
        default: 'main'
      tax_branch:
        description: 'Branch for tax'
        default: 'main'
      webhook_branch:
        description: 'Branch for webhook'
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Branch to SHA
        id: resolve
        run: |
          get_sha() {
            local branch=$1
            if [ "$branch" == "main" ] || [ "$branch" == "latest" ] || [ -z "$branch" ]; then
              echo "latest"
            else
              # Try to get branch SHA, if it fails (e.g. for external images), fallback to the input value
              SHA=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/devops-teamk23/new-yas/commits/$branch | jq -r .sha)
              if [ "$SHA" == "null" ] || [ -z "$SHA" ]; then
                echo "$branch"
              else
                echo "$SHA"
              fi
            fi
          }
          
          echo "TAX_TAG=$(get_sha ${{ github.event.inputs.tax_branch }})" >> $GITHUB_ENV
          echo "CART_TAG=$(get_sha ${{ github.event.inputs.cart_branch }})" >> $GITHUB_ENV
          echo "ORDER_TAG=$(get_sha ${{ github.event.inputs.order_branch }})" >> $GITHUB_ENV
          echo "CUSTOMER_TAG=$(get_sha ${{ github.event.inputs.customer_branch }})" >> $GITHUB_ENV
          echo "INVENTORY_TAG=$(get_sha ${{ github.event.inputs.inventory_branch }})" >> $GITHUB_ENV
          echo "MEDIA_TAG=$(get_sha ${{ github.event.inputs.media_branch }})" >> $GITHUB_ENV
          echo "PAYMENT_TAG=$(get_sha ${{ github.event.inputs.payment_branch }})" >> $GITHUB_ENV
          echo "PRODUCT_TAG=$(get_sha ${{ github.event.inputs.product_branch }})" >> $GITHUB_ENV
          echo "RECOMMENDATION_TAG=$(get_sha ${{ github.event.inputs.recommendation_branch }})" >> $GITHUB_ENV
          echo "SAMPLEDATA_TAG=$(get_sha ${{ github.event.inputs.sampledata_branch }})" >> $GITHUB_ENV
          echo "SEARCH_TAG=$(get_sha ${{ github.event.inputs.search_branch }})" >> $GITHUB_ENV
          echo "STOREFRONT_TAG=$(get_sha ${{ github.event.inputs.storefront_branch }})" >> $GITHUB_ENV
          echo "STOREFRONT_BFF_TAG=$(get_sha ${{ github.event.inputs.storefront_bff_branch }})" >> $GITHUB_ENV
          echo "SWAGGER_UI_TAG=$(get_sha ${{ github.event.inputs.swagger_ui_branch }})" >> $GITHUB_ENV
          echo "WEBHOOK_TAG=$(get_sha ${{ github.event.inputs.webhook_branch }})" >> $GITHUB_ENV
          echo "BACKOFFICE_TAG=$(get_sha ${{ github.event.inputs.backoffice_branch }})" >> $GITHUB_ENV
          echo "BACKOFFICE_BFF_TAG=$(get_sha ${{ github.event.inputs.backoffice_bff_branch }})" >> $GITHUB_ENV

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/apps/yas-deploy
            git pull origin main
            
            kubectl create namespace ${{ github.event.inputs.namespace_name }} --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace ${{ github.event.inputs.namespace_name }} istio-injection=enabled --overwrite
            
            helm upgrade --install developer-build charts/yas \
              --namespace ${{ github.event.inputs.namespace_name }} \
              --set global.serviceType=NodePort \
              --set global.setHosts=false \
              --set global.createSecret=true \
              --set global.mtls.mode=PERMISSIVE \
              --set global.postgresql.password=${{ secrets.POSTGRESQL_PASSWORD }} \
              --set global.elasticsearch.password=${{ secrets.ELASTICSEARCH_PASSWORD }} \
              --set global.redis.password=${{ secrets.REDIS_PASSWORD }} \
              --set global.keycloak.backofficeBffClientSecret=${{ secrets.KEYCLOAK_BACKOFFICE_BFF_CLIENT_SECRET }} \
              --set global.keycloak.storefrontBffClientSecret=${{ secrets.KEYCLOAK_STOREFRONT_BFF_CLIENT_SECRET }} \
              --set global.keycloak.customerManagementClientSecret=${{ secrets.KEYCLOAK_CUSTOMER_MANAGEMENT_CLIENT_SECRET }} \
              --set services.tax.tag=${{ env.TAX_TAG }} \
              --set services.cart.tag=${{ env.CART_TAG }} \
              --set services.order.tag=${{ env.ORDER_TAG }} \
              --set services.customer.tag=${{ env.CUSTOMER_TAG }} \
              --set services.inventory.tag=${{ env.INVENTORY_TAG }} \
              --set services.media.tag=${{ env.MEDIA_TAG }} \
              --set services.payment.tag=${{ env.PAYMENT_TAG }} \
              --set services.product.tag=${{ env.PRODUCT_TAG }} \
              --set services.recommendation.tag=${{ env.RECOMMENDATION_TAG }} \
              --set services.sampledata.tag=${{ env.SAMPLEDATA_TAG }} \
              --set services.search.tag=${{ env.SEARCH_TAG }} \
              --set services.storefront.tag=${{ env.STOREFRONT_TAG }} \
              --set services.storefront-bff.tag=${{ env.STOREFRONT_BFF_TAG }} \
              --set services.swagger-ui.tag=${{ env.SWAGGER_UI_TAG }} \
              --set services.webhook.tag=${{ env.WEBHOOK_TAG }} \
              --set services.backoffice.tag=${{ env.BACKOFFICE_TAG }} \
              --set services.backoffice-bff.tag=${{ env.BACKOFFICE_BFF_TAG }}
              
      - name: Print Access Info
        run: |
          echo "### Deploy successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Hệ thống đã được cài đặt thành công với Helm release **developer-build** vào namespace **${{ github.event.inputs.namespace_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Access the application at the following NodePorts:" >> $GITHUB_STEP_SUMMARY
          echo "- **Storefront (Dùng port này để có API Gateway)**: [http://yas.lethanhcong.site:30088](http://yas.lethanhcong.site:30088)" >> $GITHUB_STEP_SUMMARY
          echo "- **Backoffice (Dùng port này để có API Gateway)**: [http://yas.lethanhcong.site:30090](http://yas.lethanhcong.site:30090)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swagger UI**: [http://yas.lethanhcong.site:30098](http://yas.lethanhcong.site:30098)" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Direct access to backend services (For debugging only):" >> $GITHUB_STEP_SUMMARY
          echo "- **product**: [http://yas.lethanhcong.site:30080](http://yas.lethanhcong.site:30080)" >> $GITHUB_STEP_SUMMARY
          echo "- **cart**: [http://yas.lethanhcong.site:30081](http://yas.lethanhcong.site:30081)" >> $GITHUB_STEP_SUMMARY
          echo "- **order**: [http://yas.lethanhcong.site:30082](http://yas.lethanhcong.site:30082)" >> $GITHUB_STEP_SUMMARY
          echo "- **customer**: [http://yas.lethanhcong.site:30083](http://yas.lethanhcong.site:30083)" >> $GITHUB_STEP_SUMMARY
          echo "- **inventory**: [http://yas.lethanhcong.site:30084](http://yas.lethanhcong.site:30084)" >> $GITHUB_STEP_SUMMARY
          echo "- **tax**: [http://yas.lethanhcong.site:30085](http://yas.lethanhcong.site:30085)" >> $GITHUB_STEP_SUMMARY
          echo "- **media**: [http://yas.lethanhcong.site:30086](http://yas.lethanhcong.site:30086)" >> $GITHUB_STEP_SUMMARY
          echo "- **search**: [http://yas.lethanhcong.site:30087](http://yas.lethanhcong.site:30087)" >> $GITHUB_STEP_SUMMARY
          echo "- **storefront** (Direct UI without API Gateway): [http://yas.lethanhcong.site:30089](http://yas.lethanhcong.site:30089)" >> $GITHUB_STEP_SUMMARY
          echo "- **backoffice** (Direct UI without API Gateway): [http://yas.lethanhcong.site:30091](http://yas.lethanhcong.site:30091)" >> $GITHUB_STEP_SUMMARY
          echo "- **sampledata**: [http://yas.lethanhcong.site:30093](http://yas.lethanhcong.site:30093)" >> $GITHUB_STEP_SUMMARY
          echo "- **payment**: [http://yas.lethanhcong.site:30094](http://yas.lethanhcong.site:30094)" >> $GITHUB_STEP_SUMMARY
          echo "- **recommendation**: [http://yas.lethanhcong.site:30096](http://yas.lethanhcong.site:30096)" >> $GITHUB_STEP_SUMMARY
          echo "- **webhook**: [http://yas.lethanhcong.site:30097](http://yas.lethanhcong.site:30097)" >> $GITHUB_STEP_SUMMARY
