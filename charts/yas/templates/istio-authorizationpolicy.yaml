{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}-policy
  labels:
    {{- include "yas.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  action: ALLOW
  rules:
    {{- if or $svc.host (eq ($.Values.global.serviceType | default "NodePort") "NodePort") }}
    # Cho phép truy cập từ mọi nguồn đối với các dịch vụ public hoặc khi đang test bằng NodePort
    - {}
    {{- else }}
    - from:
        - source:
            # Cho phép nội bộ giao tiếp
            namespaces: ["dev", "staging", "ingress-nginx", "istio-system", "{{ $.Release.Namespace }}"]
    {{- end }}
    - to:
        - operation:
            # Cho phép Kubelet gọi API health check
            paths: ["/actuator/health/liveness", "/actuator/health/readiness"]
{{- end }}
{{- end }}
